name: Release

# 手动触发的发布流水线。替代 docs/RELEASE.md 里那套本地手跑命令——
# 本地发布依赖 ~/.npmrc 里的 token（rc.7 就卡在这一步）、且 npm 自 2025 起是
# **异步发布**：`npm publish` 返回成功时 registry 可能还没有这个包（实测 rc.7
# 约 4 分钟后 tarball 才可取）。所以这里把「可见性核对」做成发布的后置步骤，
# 而不是发布后凭输出判断成功。
#
# 认证走 OIDC Trusted Publishing：**不需要 NPM_TOKEN secret**。前提是 npmjs.com 该包的
# Trusted Publisher 已绑定本仓库 + 本 workflow 文件名（release.yml），且仓库 public。
# provenance 也由同一份 OIDC 身份签发。
on:
  # 推 tag 即发布（与 dsh-office 的 publish.yml 一致）；也可在 Actions 页面手动 dispatch。
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，必须与 package.json 的 version 完全一致（例：1.0.0-rc.8）'
        required: true
        type: string
      dist-tag:
        description: 'npm dist-tag（预发布号也要用 latest，否则已装用户拉不到）'
        required: true
        default: latest
        type: choice
        options: [latest, next, rc]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 两种入口：推 tag 时 ref_name 形如 v1.0.0-rc.9；手动 dispatch 时用输入的纯
      # 版本号。各步骤统一用 ${RAW_VERSION#v} 取纯版本，避免维护两套变量。
      RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
    permissions:
      contents: write # 建 GitHub Release
      id-token: write # npm provenance（OIDC）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: 版本一致性（发布目标 vs package.json）
        run: |
          VERSION="${RAW_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json 版本为 $PKG_VERSION，与发布目标 $VERSION 不一致；先改版本并提交"
            exit 1
          fi

      - name: 四门禁（lint / typecheck / test / build）
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: bundle 新鲜度（跟仓 lib/ 必须与全新 build 一致）
        run: git diff --exit-code -- lib/

      - name: 发布到 npm（OIDC + provenance）
        run: npm publish --access public --tag "$DIST_TAG" --provenance

      # 关键：publish 的成功输出不等于包可用。轮询 tarball 直到 200。
      - name: 等待 registry 可见（tarball 200）
        run: |
          VERSION="${RAW_VERSION#v}"
          URL="https://registry.npmjs.org/@huiliyi37/dsh-tianshu-tui/-/dsh-tianshu-tui-$VERSION.tgz"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$CODE" = "200" ]; then
              echo "tarball 可取（第 ${i} 次探测，约 $((i * 10))s）"
              exit 0
            fi
            echo "第 ${i} 次探测 HTTP $CODE，等 10s"
            sleep 10
          done
          # 超时只告警、不失败：publish 步骤已经成功，包只是在 npm 的处理队列里。
          # 让整个 workflow 变红会连带跳过后面的 dist-tag 核对与 Release 创建
          # （1.0.0-rc.9 就是这样：包发出去了，Release 却没建）。
          echo "::warning::10 分钟内 tarball 仍不可取（最后 HTTP $CODE）：包可能仍在 npm 队列，稍后手动核对"

      - name: 核对 dist-tag 指向
        run: |
          VERSION="${RAW_VERSION#v}"
          TAG=$(npm view "@huiliyi37/dsh-tianshu-tui" "dist-tags.$DIST_TAG")
          echo "dist-tags.$DIST_TAG = $TAG"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::dist-tag 未指向新版本"
            exit 1
          fi

      - name: 建 GitHub Release
        run: |
          NOTES=/tmp/release-notes.md
          VERSION="${RAW_VERSION#v}"
          # 用 awk 而非 sed：版本表达式后紧跟 `\]` 会让 GitHub 的表达式解析器把
          # 后续 shell 文本吞进表达式（Unexpected symbol: 'version}'，整个 workflow
          # 无法加载）。这里版本已由 RAW_VERSION 注入到 shell，awk 的 index() 又
          # 避开了方括号正则与转义。
          awk -v v="$VERSION" '$0 ~ "^## \\[" { if (p) exit; if (index($0, "[" v "]")) p=1 } p' CHANGELOG.md > "$NOTES" || true
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file "$NOTES" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
